<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calistenia · Visor 3D encuadre v2</title><style>body{margin:0;background:#101a17;color:#edf8f0;font:16px system-ui}main{max-width:950px;margin:auto;padding:20px}h1{font-size:25px}p,small{color:#b5c9be}#stage{height:min(65vh,600px);min-height:330px;border-radius:18px;background:radial-gradient(circle at 50% 35%,#2c4a3e,#101a17);overflow:hidden}button,input,select{font:inherit;border-radius:9px;padding:10px;border:1px solid #567367;background:#21372e;color:white}button{cursor:pointer;background:#237d5a}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}#status{min-height:26px}small{display:block}</style></head><body><main><h1>Entrenador 3D · Encuadre automático v2</h1><p>Prueba independiente. El personaje debe aparecer completo; puedes girarlo y acercarlo con el ratón.</p><div class="controls"><button id="demo">Recargar personaje</button><label>Seleccionar archivo GLB <input type="file" id="file" accept=".glb,.gltf,model/gltf-binary"></label></div><div id="stage"></div><div class="controls"><label>Animación <select id="clips"><option>Sin modelo</option></select></label><button id="pause">Pausar / reanudar</button><button id="reset">Ver cuerpo completo</button></div><p id="status" role="status">Iniciando motor 3D…</p><small>El soldado es únicamente un modelo de prueba. El visor necesita internet para cargar Three.js y el modelo.</small></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script>window.addEventListener('error',e=>{document.querySelector('#status').textContent='Error: '+e.message});window.addEventListener('unhandledrejection',e=>{document.querySelector('#status').textContent='Error: '+(e.reason?.message||e.reason)});</script><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status'),clips=document.querySelector('#clips');
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});}catch(e){status.textContent='No se pudo iniciar WebGL: '+e.message;throw e}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x537b65,2.6));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(3,7,5);scene.add(sun);
const camera=new THREE.PerspectiveCamera(40,1,.01,1000);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=.5;controls.maxDistance=100;
const floor=new THREE.Mesh(new THREE.CircleGeometry(3,80),new THREE.MeshStandardMaterial({color:0x315647,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.025;scene.add(floor);
let model=null,mixer=null,actions=[],current=null,objectURL=null,modelSize=2;const clock=new THREE.Clock();
function fit(){const r=stage.getBoundingClientRect();const w=Math.max(1,r.width),h=Math.max(1,r.height);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(model)frameModel()}
function frameModel(){if(!model)return;model.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(model);if(box.isEmpty())return;const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());const sphere=new THREE.Sphere();box.getBoundingSphere(sphere);
// Fit a bounding sphere inside both vertical and horizontal FOV, with generous breathing room.
const vfov=THREE.MathUtils.degToRad(camera.fov);const hfov=2*Math.atan(Math.tan(vfov/2)*camera.aspect);const limitingHalfFov=Math.min(vfov,hfov)/2;const distance=Math.max(3,sphere.radius/Math.sin(limitingHalfFov)*1.65);
controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(distance*.12,distance*.08,distance));camera.near=Math.max(.01,distance/1000);camera.far=Math.max(100,distance*15);camera.updateProjectionMatrix();controls.update();}
new ResizeObserver(fit).observe(stage);fit();
function show(gltf){if(model)scene.remove(model);if(mixer)mixer.stopAllAction();model=gltf.scene;scene.add(model);model.position.set(0,0,0);model.scale.setScalar(1);model.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(model),sz=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());if(!Number.isFinite(sz.y)||sz.y<.001){status.textContent='Modelo sin geometría visible';return}
const scale=2/Math.max(sz.y,sz.x,sz.z);model.scale.setScalar(scale);model.position.set(-center.x*scale,-b.min.y*scale,-center.z*scale);model.updateMatrixWorld(true);modelSize=2;frameModel();
mixer=new THREE.AnimationMixer(model);actions=gltf.animations.map(c=>mixer.clipAction(c));clips.replaceChildren();const empty=document.createElement('option');empty.textContent='Sin animación';empty.value='-1';clips.appendChild(empty);gltf.animations.forEach((c,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=c.name||`Animación ${i+1}`;clips.appendChild(o)});current=null;if(actions.length){clips.value='0';play(0)}status.textContent=`Modelo cargado · ${gltf.animations.length} animaciones · Encuadre calculado. Pulsa «Ver cuerpo completo» si lo mueves.`;}
function play(i){if(current)current.fadeOut(.2);current=actions[i]||null;if(current)current.reset().fadeIn(.2).play()}
clips.addEventListener('change',()=>play(Number(clips.value)));
document.querySelector('#pause').onclick=()=>{if(mixer)mixer.timeScale=mixer.timeScale?0:1};document.querySelector('#reset').onclick=frameModel;
const loader=new GLTFLoader();function load(url){status.textContent='Cargando personaje…';loader.load(url,show,undefined,e=>{status.textContent='No se pudo cargar el modelo: '+(e.message||e);console.error(e)})}
document.querySelector('#demo').onclick=()=>load('https://threejs.org/examples/models/gltf/Soldier.glb');document.querySelector('#file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);load(objectURL)};
load('https://threejs.org/examples/models/gltf/Soldier.glb');function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(mixer)mixer.update(dt);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
