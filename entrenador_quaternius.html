<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrenador Quaternius</title><style>body{background:#101a17;color:#fff;font:16px system-ui;margin:0}main{max-width:850px;margin:auto;padding:18px}#stage{height:60vh;min-height:340px;background:#243c32;border-radius:14px}button,select{padding:12px;font:inherit;border-radius:8px;margin:8px;background:#286c51;color:#fff}#status{color:#c4dfcd}</style></head><body><main><h2>Entrenador 3D · Quaternius</h2><p>Personajes CC0. Selecciona un personaje y comprueba su animación.</p><select id="who"><option value="Beach">Deportivo · playa</option><option value="Casual_2">Ropa informal</option><option value="Casual_Hoodie">Sudadera</option></select><select id="clips"></select><div id="stage"></div><button id="reset">Ver cuerpo completo</button><button id="pause">Pausar / continuar</button><p id="status">Iniciando…</p></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script>window.onerror=(m)=>document.querySelector('#status').textContent='Error: '+m;window.onunhandledrejection=e=>document.querySelector('#status').textContent='Error: '+e.reason;</script><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';const el=document.querySelector('#stage'),status=document.querySelector('#status'),clips=document.querySelector('#clips');let model,mixer,actions=[],current,dist=5;const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x546d5e,3));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(3,5,6);scene.add(sun);const camera=new THREE.PerspectiveCamera(40,1,.01,200);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const clock=new THREE.Clock();function size(){const r=el.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}new ResizeObserver(size).observe(el);size();function frame(){if(!model)return;const b=new THREE.Box3().setFromObject(model);const c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3());controls.target.copy(c);const fov=THREE.MathUtils.degToRad(camera.fov);const aspect=camera.aspect;dist=Math.max(s.y/(2*Math.tan(fov/2)),s.x/(2*Math.tan(fov/2)*aspect),s.z)*1.9+1;camera.position.set(c.x+dist*.32,c.y+dist*.15,c.z+dist);camera.lookAt(c);controls.update()}function load(){const who=document.querySelector('#who').value;status.textContent='Cargando '+who+'…';new GLTFLoader().load('./'+who+'.gltf',g=>{if(model)scene.remove(model);if(mixer)mixer.stopAllAction();model=g.scene;scene.add(model);mixer=new THREE.AnimationMixer(model);actions=g.animations.map(a=>mixer.clipAction(a));clips.innerHTML='';g.animations.forEach((a,i)=>{let o=document.createElement('option');o.value=i;o.textContent=a.name||'Movimiento '+(i+1);clips.appendChild(o)});current=null;if(actions.length){current=actions[0];current.play()}frame();status.textContent='Modelo cargado · '+actions.length+' animaciones';},undefined,e=>status.textContent='Error de carga: '+e.message)}document.querySelector('#who').onchange=load;clips.onchange=()=>{if(current)current.stop();current=actions[+clips.value];if(current)current.reset().play()};document.querySelector('#reset').onclick=frame;document.querySelector('#pause').onclick=()=>{if(mixer)mixer.timeScale=mixer.timeScale?0:1};function tick(){requestAnimationFrame(tick);if(mixer)mixer.update(Math.min(clock.getDelta(),.05));controls.update();renderer.render(scene,camera)}tick();load();</script></body></html>
